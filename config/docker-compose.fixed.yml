services:
  ssh-shell-mcp:
    build: ..
    container_name: ssh-shell-mcp
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      - SSH_MCP_LOG_DIR=/app/logs
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN}
      - SSH_HOSTS_YAML=/app/config/hosts.yaml
      - SSH_POLICIES_YAML=/app/config/policies.yaml
    volumes:
      - ~/.ssh:/root/.ssh:ro
      - ./logs:/app/logs:rw
      - ./config:/app/config:rw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, os
          token = os.environ.get('MCP_AUTH_TOKEN', '')
          req = urllib.request.Request('http://localhost:8000/mcp')
          req.add_header('Authorization', f'Bearer {token}')
          urllib.request.urlopen(req)
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    labels:
      maintainer: kamau
      description: "ssh-shell-mcp — AI-driven SSH orchestration MCP server"
